syntax = "proto3";

option go_package = "github.com/compscidr/sair/proto/devicesource";

import "google/protobuf/empty.proto";
package devicesource;

service DeviceSource {
  rpc GetDevices(google.protobuf.Empty) returns (Devices) {}
  rpc EnqueueCommand(Command) returns (stream CommandResult) {}
  // Execute a command on a specific device identified by serial number
  rpc ExecOnDevice(DeviceCommand) returns (stream CommandResult) {}
  // Bidirectional raw byte forwarding to a device via the real ADB server.
  // Used for protocols like sync: that the proxy cannot interpret.
  rpc ForwardToDevice(stream ForwardData) returns (stream ForwardData) {}
  // Set a device's Wi-Fi to a known state using the bench network configured
  // on this device source (WIFI_SSID / WIFI_PASSPHRASE). FailedPrecondition
  // when no network is configured: the bench does not manage Wi-Fi.
  rpc SetWifi(WifiRequest) returns (google.protobuf.Empty) {}
  // Uninstall every third-party package that is not in the device's baseline
  // (recorded when the device was first seen, or BASELINE_PACKAGES), and
  // force-stop / clear the configured apps. Used on release, before the
  // Wi-Fi reset, so a suggestion a removed app registered goes with it.
  // With `since`, that snapshot is kept instead of the baseline. Otherwise
  // FailedPrecondition when no baseline is known for the device yet.
  rpc ResetPackages(ResetPackagesRequest) returns (ResetPackagesResponse) {}
  // The device's third-party packages right now, for a ResetPackages `since`.
  // Unimplemented from a device source that would ignore `since`.
  rpc ListPackages(ListPackagesRequest) returns (ListPackagesResponse) {}
  // Wake the screen and dismiss the keyguard, verified (sair#92). Used on
  // acquire and after the release reset, so a job never gets a phone asleep
  // or on its lock screen. FailedPrecondition when the keyguard stays up,
  // which on a bench phone means a secure lock sair cannot dismiss.
  rpc Wake(WakeRequest) returns (google.protobuf.Empty) {}
  // Reboot the device if it has been up longer than REBOOT_UPTIME_HOURS and
  // wait until it has booted (sair#93). The caller makes sure the device is
  // unacquired and wakes it afterwards. A no-op below the limit or when the
  // limit is 0.
  rpc RebootIfStale(RebootRequest) returns (RebootResponse) {}
  // Cycle Bluetooth fully off (BLE too, not just classic) and back on, and
  // wait until the adapter reports ON
  // (sair#127), so a stack an earlier job wedged does not carry over. Used on
  // release, and on acquire when that release reset did not run. Bluetooth
  // is left on. Unimplemented for a phone without the adapter state in
  // `dumpsys bluetooth_manager` (Android 4.x); DeadlineExceeded, and the
  // device warning, when the radio does not come back.
  rpc ResetBluetooth(ResetBluetoothRequest) returns (google.protobuf.Empty) {}
  // Reboot the device if a radio whose reset just failed is wedged: its
  // service (`dumpsys wifi` / `dumpsys bluetooth_manager`) no longer answers
  // (sair#139). A phone whose service answers is left up, since some hang on
  // `svc` with healthy radios. Same rules as RebootIfStale: never a phone
  // with a secure lock (FailedPrecondition), and the caller holds the reset
  // lock, re-runs the reset and wakes the phone afterwards.
  rpc RebootIfWedged(WedgedRadioRequest) returns (RebootResponse) {}
  // Clear a UiAutomation registration a dead session leaked (sair#128),
  // which fails every later instrumentation with "UiAutomationService ...
  // already registered!". Probes with `uiautomator dump`; on a leak kills
  // the shell-launched processes that can hold one, and reboots only if the
  // probe still fails. The caller holds the device's reset lock.
  rpc ClearUiAutomation(UiAutomationRequest) returns (UiAutomationResponse) {}
  // The device source's recent log lines that mention serial, oldest first,
  // so the proxy can attach them to a lock log when an acquire or a release
  // reset fails on that device (sair#97).
  rpc RecentLog(RecentLogRequest) returns (RecentLogResponse) {}
  // Disable the Play Store for a lease (hold) or enable it again (release),
  // so an auto-update of Play services cannot force-stop the app under test
  // mid-job (sair#151); updates install between leases. Unimplemented for a
  // phone without the Play Store or below Android 5, whose pm crashes on it;
  // FailedPrecondition when the phone refuses (Xiaomi: "Cannot disable
  // system packages").
  rpc HoldUpdates(HoldUpdatesRequest) returns (google.protobuf.Empty) {}
}

message HoldUpdatesRequest {
  string serial = 1;
  bool hold = 2;
}

message RecentLogRequest {
  string serial = 1;
}

message RecentLogResponse {
  repeated string lines = 1;
}

message WakeRequest {
  string serial = 1;
}

message ResetBluetoothRequest {
  string serial = 1;
}

message WedgedRadioRequest {
  string serial = 1;
  // "wifi" or "bluetooth".
  string radio = 2;
}

message RebootRequest {
  string serial = 1;
}

message RebootResponse {
  bool rebooted = 1;
  // Uptime before the call, in seconds.
  int64 uptime_seconds = 2;
}

message UiAutomationRequest {
  string serial = 1;
}

message UiAutomationResponse {
  // Empty when no leak was found; else how it was cleared: "killed <pid>
  // <name>, ..." or "rebooted".
  string cleared = 1;
}

message ResetPackagesRequest {
  string serial = 1;
  // Keep these packages instead of the baseline. Present but empty keeps none;
  // absent uses the baseline.
  PackageSnapshot since = 2;
}

message PackageSnapshot {
  repeated string packages = 1;
}

message ListPackagesRequest {
  string serial = 1;
}

message ListPackagesResponse {
  // Third-party packages, sorted.
  repeated string packages = 1;
}

message ResetPackagesResponse {
  // Packages uninstalled, sorted.
  repeated string removed = 1;
  // Wi-Fi suggestions that disappeared with them, as `cmd wifi
  // list-all-suggestions` printed them (SSID and security type).
  repeated string suggestions_removed = 2;
}

message WifiRequest {
  enum State {
    // Forget every shell-added suggestion and saved network, then toggle the
    // radio: on, nothing registered, not associated. Used on release.
    RESET = 0;
    // Forget suggestions and saved networks; the radio stays on.
    OFF = 1;
    // Suggest the bench network and wait until the device reaches the Internet.
    ON = 2;
  }
  string serial = 1;
  State state = 2;
  // ON only: "2.4", "5" or "6" pins the suggestion to the strongest BSSID of
  // the bench SSID the phone sees in that GHz band; empty lets Android pick.
  // Device sources that predate it ignore it and join any band.
  string band = 3;
}

message Devices {
  repeated Device devices = 1;
}

message Device {
  string serial = 1;
  string manufacturer = 2;
  string model = 3;
  int32 release = 4;
  int32 sdk = 5;
  // Distinct types of the accounts signed in on the device (e.g. com.google),
  // sorted; never their names. Empty when none are found.
  repeated string account_types = 6;
  // When sair last rebooted the device (RebootIfStale), unix ms; 0 if never
  // since this device source started.
  int64 last_reboot_ms = 7;
  // Why the device is not ready for a job, for a bench owner to act on:
  // a keyguard sair could not dismiss, or Bluetooth that did not come back
  // on after a reset. Empty when fine.
  string warning = 8;
  // Wi-Fi join outcomes; unset before the first ON.
  WifiStats wifi = 9;
}

// How often a phone met the Wi-Fi ON contract (sair#96), since the device
// source started, so a bench owner sees a marginal phone as one number
// rather than a series of red jobs.
message WifiStats {
  // ON attempts, and how many did not get online.
  int32 joins = 1;
  int32 failures = 2;
  // Failures by the last reason the phone was not online: not_associated,
  // other_ssid, not_validated, no_route, other.
  map<string, int32> failures_by_reason = 3;
  // The latest failure's message and when it happened, unix ms.
  string last_failure = 4;
  int64 last_failure_ms = 5;
  // Time to online of successful joins: the latest, the median of the
  // latest 100, and the slowest; and the limit (WIFI_CONNECT_TIMEOUT_SECONDS).
  int64 last_join_ms = 6;
  int64 median_join_ms = 7;
  int64 slowest_join_ms = 8;
  int64 timeout_ms = 9;
  // What a bench owner could do about it, empty when nothing stands out.
  string hint = 10;
}

message Command {
  string cmd = 1;
}

message DeviceCommand {
  string serial = 1;
  string command = 2;
  int32 timeout_seconds = 3;
}

message CommandResult {
  int32 place_in_queue = 1;
  string stdout = 2;
  string stderr = 3;
  int32 exit_code = 4;
}

message ForwardData {
  oneof payload {
    ForwardSetup setup = 1;
    bytes data = 2;
  }
}

message ForwardSetup {
  string serial = 1;
  string initial_command = 2;
}
