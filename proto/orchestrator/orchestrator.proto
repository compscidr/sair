syntax = "proto3";

option go_package = "github.com/compscidr/sair/proto/orchestrator";

package orchestrator;

service Orchestrator {
  rpc ListDevices(ListDevicesRequest) returns (DeviceList) {}
  rpc AcquireLock(AcquireLockRequest) returns (AcquireLockResponse) {}
  rpc ReleaseLock(ReleaseLockRequest) returns (ReleaseLockResponse) {}
  rpc LockHeartbeat(LockHeartbeatRequest) returns (LockHeartbeatResponse) {}
  rpc ReportDevices(ReportDevicesRequest) returns (ReportDevicesResponse) {}
  // One long-lived stream per proxy: version and identity first, then device
  // reports, lock heartbeats and lock log entries; the orchestrator pushes
  // lock expiry back. Replaces the periodic unary calls for proxies that use it.
  rpc Session(stream ProxyMessage) returns (stream OrchestratorMessage) {}
  // One relayed ADB connection between the proxy holding a lock (HOLDER) and the
  // proxy that has the device (OWNER). Both call this outbound; the orchestrator
  // splices the two calls that name the same tunnel_id.
  rpc Tunnel(stream TunnelData) returns (stream TunnelData) {}
}

message ListDevicesRequest {
  reserved 1;
}

message DeviceList {
  repeated DeviceSourceInfo sources = 1;
}

message DeviceSourceInfo {
  string source_id = 1;
  string address = 2;
  bool online = 3;
  repeated DeviceInfo devices = 4;
}

message DeviceInfo {
  string serial = 1;
  string manufacturer = 2;
  string model = 3;
  int32 sdk = 4;
  int32 release = 5;
  bool busy = 6;
}

// A lock request either names the devices it wants (serials) or asks for a
// number of arbitrary free devices (count). Setting both is invalid; setting
// neither means "all devices in the tenant's pool".
message AcquireLockRequest {
  repeated string serials = 1;
  string repo = 2;
  int32 count = 3;
  // Link to the CI run holding the lock (e.g. a GitHub Actions run URL).
  string run_url = 4;
  // Same value as ProxyHello.proxy_id. Locks are granted only on devices this
  // proxy reported. Empty from proxies that predate sessions.
  string proxy_id = 6;
}

message AcquireLockResponse {
  string lock_id = 1;
  repeated string serials = 2;
  // Granted devices that live on another proxy (or another tenant): reach them
  // through Tunnel rather than a local device source. Carries the owner's
  // reported info so the holder can list them. Empty for proxies without a
  // proxy_id and from orchestrators that predate the relay.
  repeated DeviceInfo remote_devices = 3;
}

// One ADB request a client made on a scoped port while holding a lock, as
// observed by the proxy: the service string the client asked the device for
// (e.g. "shell,v2,raw:am instrument -w ..."), when, how long the tunnel stayed
// open, and how many bytes came back. Together these are the job's log.
//
// A request is reported in pieces that share a request_id: an open entry when
// the service is seen (timestamp, serial, service, open = true), zero or more
// output entries as the device answers (output set, nothing else), and a close
// entry when the tunnel ends (duration_ms, bytes_to_client, plus serial and
// service again). Proxies that predate this send one entry per request, the
// close, with request_id 0.
message LockLogEntry {
  int64 timestamp_ms = 1;
  string serial = 2;
  string service = 3;
  int64 duration_ms = 4;
  int64 bytes_to_client = 5;
  uint64 request_id = 6;
  bool open = 7;
  // Text the device sent back, in order, for shell services only; sync,
  // exec and the rest are binary and only counted. Non-UTF-8 output is
  // replaced by a single "(binary output omitted)" piece.
  string output = 8;
}

message ReleaseLockRequest {
  string lock_id = 1;
  // Outcome of the job that held the lock. From the client: success,
  // failure, cancelled, or empty when it did not say. From the proxy itself:
  // error (scoped port setup failed) or cancelled (proxy shut down). Locks
  // that expire without a release are recorded by the orchestrator as timeout.
  string status = 2;
  // Log entries not yet sent by a heartbeat.
  repeated LockLogEntry log = 3;
}

message ReleaseLockResponse {
  bool released = 1;
}

message LockHeartbeatRequest {
  string lock_id = 1;
  // Log entries recorded since the previous heartbeat, so a lock that later
  // expires still has its history on the orchestrator.
  repeated LockLogEntry log = 2;
}

message LockHeartbeatResponse {
  bool alive = 1;
}

// ReportDevicesRequest is sent by the proxy to report its current device list.
// The busy field in DeviceInfo is ignored; busy state is managed by the orchestrator.
message ReportDevicesRequest {
  repeated DeviceInfo devices = 1;
}

message ReportDevicesResponse {}

// Proxy -> orchestrator envelope. hello is always the first message.
message ProxyMessage {
  oneof msg {
    ProxyHello hello = 1;
    ReportDevicesRequest devices = 2;   // full list, same semantics as the unary call
    LockLog lock_log = 3;
    LockHeartbeatRequest heartbeat = 4; // its log field is left empty on the stream
    RelayFailed relay_failed = 5;
  }
}

message ProxyHello {
  string version = 1;                  // internal/version.Version, "dev" for local builds
  string proxy_id = 2;                 // hostname by default, PROXY_ID env overrides
  int64 device_report_interval_s = 3;  // informational
  int64 lock_heartbeat_interval_s = 4; // informational
}

message LockLog {
  string lock_id = 1;
  repeated LockLogEntry entries = 2;
}

// Orchestrator -> proxy envelope.
message OrchestratorMessage {
  oneof msg {
    OrchestratorWelcome welcome = 1;
    LockExpired lock_expired = 2;
    RelayOpen relay_open = 3;
  }
}

message OrchestratorWelcome {
  string version = 1;   // orchestrator build commit
  string tenant_id = 2; // which account the proxy landed in
}

message LockExpired {
  string lock_id = 1;
}

// Tunnel payload: setup first from each side, then raw ADB bytes (the same
// shape as devicesource.ForwardData, so the owner can pump without translating).
//
// half_close is a TCP-style "I'm done writing" signal for the *other* leg of
// the tunnel. gRPC's own CloseSend only tells the orchestrator "no more from
// me on this call" -- the orchestrator, splicing two independent Tunnel
// calls, has no transport-level way to make the peer's own call observe that
// without ending it outright, which would also cut off any reply still in
// flight (e.g. a device finishing its output after stdin closes). Carrying
// it as an explicit message lets the orchestrator forward it while keeping
// both calls open for the reply.
message TunnelData {
  oneof payload {
    TunnelSetup setup = 1;
    bytes data = 2;
    bool half_close = 3;
    // orchestrator -> holder only: the owner joined, bytes may flow
    bool accepted = 4;
  }
}

message TunnelSetup {
  string tunnel_id = 1;
  TunnelSide side = 2;
  // HOLDER only: what the ADB client asked for, so the owner opens the device
  // with the same initial command. Empty for a plain transport.
  string serial = 3;
  string initial_command = 4;
}

enum TunnelSide {
  TUNNEL_SIDE_UNSPECIFIED = 0;
  TUNNEL_SIDE_HOLDER = 1; // has the lock and the ADB client
  TUNNEL_SIDE_OWNER = 2;  // has the device
}

// Orchestrator -> owner proxy: open your half of tunnel_id for this device.
message RelayOpen {
  string tunnel_id = 1;
  string serial = 2;          // as the owner knows it
  string initial_command = 3; // forwarded from the holder's setup
  string lock_id = 4;         // for logging
}

// Owner proxy -> orchestrator: could not open the device; the holder's ADB
// client gets a FAIL with this text.
message RelayFailed {
  string tunnel_id = 1;
  string error = 2;
}
